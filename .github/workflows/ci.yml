name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Format check
        run: pnpm run fmt-check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      actions: read
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Seed database
        run: pnpm --filter @brewform/db run seed

      - name: Run tests with coverage
        run: pnpm run test-coverage

      # Main's latest coverage summaries power the before/after delta on PRs.
      # Absent on the PR that introduces this job, hence if_no_artifact_found: warn.
      - name: Download main coverage (API)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-api
          path: base-coverage/api
          if_no_artifact_found: warn

      - name: Download main coverage (shared)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-shared
          path: base-coverage/shared
          if_no_artifact_found: warn

      - name: Download main coverage (db)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-db
          path: base-coverage/db
          if_no_artifact_found: warn

      - name: Download main coverage (web)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-web
          path: base-coverage/web
          if_no_artifact_found: warn

      - name: Report API coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: API
          working-directory: apps/api
          json-summary-compare-path: ${{ hashFiles('base-coverage/api/coverage-summary.json') != '' && '../../base-coverage/api/coverage-summary.json' || '' }}

      - name: Report shared coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Shared
          working-directory: packages/shared
          json-summary-compare-path: ${{ hashFiles('base-coverage/shared/coverage-summary.json') != '' && '../../base-coverage/shared/coverage-summary.json' || '' }}

      - name: Report db coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Database
          working-directory: packages/db
          json-summary-compare-path: ${{ hashFiles('base-coverage/db/coverage-summary.json') != '' && '../../base-coverage/db/coverage-summary.json' || '' }}

      - name: Report web coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web
          working-directory: apps/web
          json-summary-compare-path: ${{ hashFiles('base-coverage/web/coverage-summary.json') != '' && '../../base-coverage/web/coverage-summary.json' || '' }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            packages/shared/coverage/
            packages/db/coverage/
            apps/web/coverage/

      # Written from main pushes only, so PRs can compare against a trustworthy baseline.
      - name: Upload main API coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-api
          path: apps/api/coverage/coverage-summary.json

      - name: Upload main shared coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-shared
          path: packages/shared/coverage/coverage-summary.json

      - name: Upload main db coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-db
          path: packages/db/coverage/coverage-summary.json

      - name: Upload main web coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-web
          path: apps/web/coverage/coverage-summary.json

  # Images are deployed to GHCR via the Release workflow; Coolify pulls from there.
  # No manual deploy steps needed in CI.
