name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Format check
        run: pnpm run fmt-check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      actions: read
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Seed database
        run: pnpm --filter @brewform/db run seed

      - name: Run tests with coverage
        run: pnpm run test-coverage

      # Main's latest coverage summaries power the before/after delta on PRs.
      # Absent on the PR that introduces this job, hence if_no_artifact_found: warn.
      - name: Download main coverage (API)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-api
          path: base-coverage/api
          if_no_artifact_found: warn

      - name: Download main coverage (shared)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-shared
          path: base-coverage/shared
          if_no_artifact_found: warn

      - name: Download main coverage (db)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-db
          path: base-coverage/db
          if_no_artifact_found: warn

      - name: Download main coverage (web)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-web
          path: base-coverage/web
          if_no_artifact_found: warn

      - name: Report coverage (single PR comment)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- brewform-coverage-report -->';
            // Targets mirror the `thresholds` in each package's vitest.config.ts.
            const pkgs = [
              { label: 'API', dir: 'apps/api', base: 'base-coverage/api', targets: { lines: 79 } },
              { label: 'Shared', dir: 'packages/shared', base: 'base-coverage/shared', targets: { lines: 97, statements: 97, functions: 95, branches: 93 } },
              { label: 'Database', dir: 'packages/db', base: 'base-coverage/db', targets: { lines: 84 } },
              { label: 'Web', dir: 'apps/web', base: 'base-coverage/web', targets: { lines: 79 } },
            ];
            const read = (p) => {
              try {
                return JSON.parse(fs.readFileSync(p, 'utf8'));
              } catch {
                return null;
              }
            };
            const cell = (pct, target, delta) => {
              if (pct == null) return 'n/a';
              let s = `${pct.toFixed(2)}%`;
              if (target != null) s += ` (🎯 ${target}%)`;
              if (delta != null) s += delta === 0 ? '<br/>🟰 ±0 pp' : `<br/>${delta > 0 ? '📈' : '📉'} ${delta >= 0 ? '+' : ''}${delta.toFixed(2)} pp`;
              return s;
            };
            let allGreen = true;
            const rows = pkgs
              .map(({ label, dir, base, targets }) => {
                const cur = read(`${dir}/coverage/coverage-summary.json`);
                const ref = read(`${base}/coverage-summary.json`);
                const t = cur?.total;
                const b = ref?.total;
                const d = (k) => (t?.[k]?.pct != null && b?.[k]?.pct != null ? t[k].pct - b[k].pct : null);
                const ok = (k) => targets[k] == null || (t?.[k]?.pct ?? -1) >= targets[k];
                const green = ['lines', 'statements', 'functions', 'branches'].every(ok);
                if (!green) allGreen = false;
                const pct = (k) => t?.[k]?.pct ?? null;
                return `| ${green ? '🟢' : '🔴'} | ${label} | ${cell(pct('lines'), targets.lines, d('lines'))} | ${cell(pct('statements'), targets.statements, d('statements'))} | ${cell(pct('functions'), targets.functions, d('functions'))} | ${cell(pct('branches'), targets.branches, d('branches'))} |`;
              })
              .join('\n');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const body = [
              `## Coverage Report ${allGreen ? '🟢' : '🔴'}`,
              '',
              '| Status | Package | Lines | Statements | Functions | Branches |',
              '| :-: | --- | ---: | ---: | ---: | ---: |',
              rows,
              '',
              `_Deltas vs main (n/a when no baseline yet). Generated in workflow [${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for commit ${context.sha.slice(0, 7)}._`,
              '',
              marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            packages/shared/coverage/
            packages/db/coverage/
            apps/web/coverage/

      # Written from main pushes only, so PRs can compare against a trustworthy baseline.
      - name: Upload main API coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-api
          path: apps/api/coverage/coverage-summary.json

      - name: Upload main shared coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-shared
          path: packages/shared/coverage/coverage-summary.json

      - name: Upload main db coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-db
          path: packages/db/coverage/coverage-summary.json

      - name: Upload main web coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-web
          path: apps/web/coverage/coverage-summary.json

  # Images are deployed to GHCR via the Release workflow; Coolify pulls from there.
  # No manual deploy steps needed in CI.
