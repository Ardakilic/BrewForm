name: CI

# The single workflow for pull requests, `main` and version tags (pr.yml and release.yml
# were merged into it). Job order:
#
#   quality ──┬── test ─────┬── publish   (push events only)
#             └── images ───┤
#   doc-drift ──────────────┘
#
# - `doc-drift` runs the dependency-free doc-drift check and docblock scan with plain
#   Node (no install, no `needs:`), in parallel with `quality`.
# - `images` builds both Docker images WITHOUT pushing and boot-tests them (compose config
#   check, standalone image smoke test, full production compose smoke test). It runs on
#   every pull request too, so a broken Dockerfile, entrypoint or edge config fails the PR.
# - `publish` runs only for pushes (main, v* tags), only after EVERY job it needs
#   succeeded (no always()), and pushes the exact images `images` smoke-tested (handed
#   over as an artifact and verified by image ID); it never builds.
# - Every job must be listed in `publish.needs`: scripts/ci/check-publish-needs.sh (run in
#   `quality`) fails CI when one is missing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default; `test` and `publish` opt into the extra scopes they need.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; main and tag runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` runs every step with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  # Docs and specs guard (doc-drift-check spec): removed-tooling tokens, stale idioms,
  # spec Purpose placeholders, broken relative links and retired capabilities, plus the
  # docblock scan. Both scripts use only node: built-ins, so nothing is installed. It runs
  # on pull requests and pushes alike, because `publish` needs it.
  doc-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Doc-drift check
        run: node scripts/doc-drift-check.ts

      - name: Docblock scan
        run: node scripts/docblock-scan.ts --check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that publish.needs lists every job
        run: scripts/ci/check-publish-needs.sh .github/workflows/ci.yml

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Format check
        run: pnpm run fmt-check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      # docs/api-reference.md is generated from the OpenAPI document; a route change without
      # a regenerated reference fails here.
      - name: API reference is up to date
        run: pnpm --filter @brewform/api run docs:api && git diff --exit-code docs/api-reference.md

  test:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Seed database
        run: pnpm --filter @brewform/db run seed

      - name: Run tests with coverage
        run: pnpm run test-coverage

      # Main's latest coverage summaries power the before/after delta on PRs.
      # Absent on the PR that introduces this job, hence if_no_artifact_found: warn.
      - name: Download main coverage (API)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-api
          path: base-coverage/api
          if_no_artifact_found: warn

      - name: Download main coverage (shared)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-shared
          path: base-coverage/shared
          if_no_artifact_found: warn

      - name: Download main coverage (db)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-db
          path: base-coverage/db
          if_no_artifact_found: warn

      - name: Download main coverage (web)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          workflow: ci.yml
          branch: main
          event: push
          name: coverage-main-web
          path: base-coverage/web
          if_no_artifact_found: warn

      - name: Report coverage (single PR comment)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- brewform-coverage-report -->';
            // Targets mirror the `thresholds` in each package's vitest.config.ts.
            const pkgs = [
              { label: 'API', dir: 'apps/api', base: 'base-coverage/api', targets: { lines: 79 } },
              { label: 'Shared', dir: 'packages/shared', base: 'base-coverage/shared', targets: { lines: 97, statements: 97, functions: 95, branches: 93 } },
              { label: 'Database', dir: 'packages/db', base: 'base-coverage/db', targets: { lines: 84 } },
              { label: 'Web', dir: 'apps/web', base: 'base-coverage/web', targets: { lines: 79 } },
            ];
            const read = (p) => {
              try {
                return JSON.parse(fs.readFileSync(p, 'utf8'));
              } catch {
                return null;
              }
            };
            const cell = (pct, target, delta) => {
              if (pct == null) return 'n/a';
              let s = `${pct.toFixed(2)}%`;
              if (target != null) s += ` (🎯 ${target}%)`;
              if (delta != null) s += delta === 0 ? '<br/>🟰 ±0 pp' : `<br/>${delta > 0 ? '📈' : '📉'} ${delta >= 0 ? '+' : ''}${delta.toFixed(2)} pp`;
              return s;
            };
            let allGreen = true;
            const rows = pkgs
              .map(({ label, dir, base, targets }) => {
                const cur = read(`${dir}/coverage/coverage-summary.json`);
                const ref = read(`${base}/coverage-summary.json`);
                const t = cur?.total;
                const b = ref?.total;
                const d = (k) => (t?.[k]?.pct != null && b?.[k]?.pct != null ? t[k].pct - b[k].pct : null);
                const ok = (k) => targets[k] == null || (t?.[k]?.pct ?? -1) >= targets[k];
                const green = ['lines', 'statements', 'functions', 'branches'].every(ok);
                if (!green) allGreen = false;
                const pct = (k) => t?.[k]?.pct ?? null;
                return `| ${green ? '🟢' : '🔴'} | ${label} | ${cell(pct('lines'), targets.lines, d('lines'))} | ${cell(pct('statements'), targets.statements, d('statements'))} | ${cell(pct('functions'), targets.functions, d('functions'))} | ${cell(pct('branches'), targets.branches, d('branches'))} |`;
              })
              .join('\n');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const body = [
              `## Coverage Report ${allGreen ? '🟢' : '🔴'}`,
              '',
              '| Status | Package | Lines | Statements | Functions | Branches |',
              '| :-: | --- | ---: | ---: | ---: | ---: |',
              rows,
              '',
              `_Deltas vs main (n/a when no baseline yet). Generated in workflow [${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for commit ${context.sha.slice(0, 7)}._`,
              '',
              marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            packages/shared/coverage/
            packages/db/coverage/
            apps/web/coverage/

      # Written from main pushes only, so PRs can compare against a trustworthy baseline.
      - name: Upload main API coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-api
          path: apps/api/coverage/coverage-summary.json

      - name: Upload main shared coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-shared
          path: packages/shared/coverage/coverage-summary.json

      - name: Upload main db coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-db
          path: packages/db/coverage/coverage-summary.json

      - name: Upload main web coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main-web
          path: apps/web/coverage/coverage-summary.json

  # Builds both images without pushing (no registry login, no secrets on pull requests)
  # and boot-tests them; runs in parallel with `test`. On push events it hands the tested
  # images to `publish` as a 1-day artifact plus their image IDs.
  images:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      api-image-id: ${{ steps.image-ids.outputs.api }}
      web-image-id: ${{ steps.image-ids.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Local data folders, dumps and env files never reach the build context, and an
      # unreadable data/postgres folder does not break the build.
      - name: Check the build context (.dockerignore)
        run: scripts/ci/dockerignore.test.sh

      # OCI labels only (source, revision, created, version); tags are set in `publish`.
      - name: OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=

      # provenance: false keeps each image a single manifest, so the ID recorded here
      # survives the docker save/load hand-off to `publish` unchanged.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          provenance: false
          tags: brewform-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

      # Pull requests (including forks) always bake the fallbacks; only push events read
      # the optional VITE_* secrets. The runtime VITE_API_URL / PUBLIC_APP_URL of the web
      # container override both values.
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          load: true
          push: false
          provenance: false
          tags: brewform-web:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ github.event_name == 'push' && secrets.VITE_API_URL || '/api/v1' }}
            VITE_PUBLIC_APP_URL=${{ github.event_name == 'push' && secrets.VITE_PUBLIC_APP_URL || 'http://localhost:8080' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      - name: Check compose.production.yml
        run: scripts/ci/compose-config-check.sh

      - name: Smoke-test both images standalone
        run: scripts/ci/smoke-images.sh brewform-api:ci brewform-web:ci

      # scripts/ci/compose-smoke.env selects brewform-api:ci / brewform-web:ci.
      - name: Smoke-test the production compose stack
        run: scripts/ci/smoke-compose.sh scripts/ci/compose-smoke.env brewform-ci

      - name: Record the tested image IDs
        id: image-ids
        if: github.event_name == 'push'
        run: |
          echo "api=$(docker image inspect --format '{{.Id}}' brewform-api:ci)" >> "$GITHUB_OUTPUT"
          echo "web=$(docker image inspect --format '{{.Id}}' brewform-web:ci)" >> "$GITHUB_OUTPUT"

      - name: Save the tested images
        if: github.event_name == 'push'
        run: docker save brewform-api:ci brewform-web:ci | gzip > images.tar.gz

      - name: Upload the tested images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ github.sha }}
          path: images.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Pushes the images `images` smoke-tested, after every other job succeeded. No build
  # step: a cache miss can never publish an untested image. Keep `needs` complete (every
  # job of this workflow; scripts/ci/check-publish-needs.sh enforces it) and never add
  # always()/failure()/cancelled() to `if`.
  publish:
    needs: [quality, test, images, doc-drift]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested images
        uses: actions/download-artifact@v8
        with:
          name: images-${{ github.sha }}

      - name: Load the images and verify they are the tested ones
        env:
          EXPECTED_API_ID: ${{ needs.images.outputs.api-image-id }}
          EXPECTED_WEB_ID: ${{ needs.images.outputs.web-image-id }}
        run: |
          gunzip -c images.tar.gz | docker load
          api_id=$(docker image inspect --format '{{.Id}}' brewform-api:ci)
          web_id=$(docker image inspect --format '{{.Id}}' brewform-web:ci)
          if [ -z "$EXPECTED_API_ID" ] || [ "$api_id" != "$EXPECTED_API_ID" ]; then
            echo "::error::brewform-api:ci is $api_id, but the images job tested '$EXPECTED_API_ID'"
            exit 1
          fi
          if [ -z "$EXPECTED_WEB_ID" ] || [ "$web_id" != "$EXPECTED_WEB_ID" ]; then
            echo "::error::brewform-web:ci is $web_id, but the images job tested '$EXPECTED_WEB_ID'"
            exit 1
          fi
          echo "Loaded the tested images: api $api_id, web $web_id"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only on the default branch (tag pushes never move it), the full commit SHA,
      # and the version tag on v* pushes. flavor latest=false stops metadata-action from
      # adding `latest` for tag events on its own. Image names are lowercased.
      - name: API image tags
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/brewform-api
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag

      - name: Web image tags
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/brewform-web
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag

      - name: Tag and push every tag
        env:
          API_TAGS: ${{ steps.meta-api.outputs.tags }}
          WEB_TAGS: ${{ steps.meta-web.outputs.tags }}
        run: |
          # Tag the local image $1 with every non-empty line of $2 and push each tag.
          push_tags() {
            local tag
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker tag "$1" "$tag"
              docker push "$tag"
            done <<< "$2"
          }
          push_tags brewform-api:ci "$API_TAGS"
          push_tags brewform-web:ci "$WEB_TAGS"
