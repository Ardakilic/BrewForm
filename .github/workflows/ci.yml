name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Format check
        run: pnpm run fmt-check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Seed database
        run: pnpm --filter @brewform/db run seed

      - name: Run tests with coverage
        run: pnpm run test-coverage

      - name: Generate coverage report
        run: pnpm run coverage-report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            packages/shared/coverage/
            packages/db/coverage/
            apps/web/coverage/

      - name: Coverage gate (>=85% line coverage, vitest scope)
        run: pnpm --filter @brewform/api exec tsx ../../scripts/coverage-gate.ts

  # Images are deployed to GHCR via the Release workflow; Coolify pulls from there.
  # No manual deploy steps needed in CI.
