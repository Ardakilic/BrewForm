name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Install dependencies
        run: deno install

      - name: Generate Drizzle migration
        run: |
          deno task db:generate
          git diff --exit-code

      - name: Build email templates
        run: deno run -A apps/api/scripts/build-email-templates.ts

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint apps/ packages/

      - name: Type check
        run: deno task check

      - name: Build
        run: deno task build

  test:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Install dependencies
        run: deno install

      - name: Generate Drizzle migration
        run: |
          deno task db:generate
          git diff --exit-code

      - name: Build email templates
        run: deno run -A apps/api/scripts/build-email-templates.ts

      - name: Run migrations
        run: deno task db:migrate

      - name: Seed database
        run: deno run --allow-all packages/db/src/seed.ts

      - name: Run tests with coverage
        run: deno task test-coverage

      - name: Generate coverage report
        run: deno coverage coverage/

      - name: Generate lcov report
        run: deno coverage coverage/ --lcov > coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # Deno Deploy handles deployment automatically via GitHub integration.
  # No manual deploy steps needed in CI.
