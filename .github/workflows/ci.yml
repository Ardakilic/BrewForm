name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          cd packages/db && npx prisma generate --schema=prisma/schema.prisma

      - name: Format check
        run: deno fmt --check apps/ packages/

      - name: Lint
        run: deno lint apps/ packages/

      - name: Type check
        run: deno check --unstable-sloppy-imports apps/api/src/main.ts

  test:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          cd packages/db && npx prisma generate --schema=prisma/schema.prisma

      - name: Run database migrations
        run: |
          export DATABASE_URL="postgresql://brewform:brewform@localhost:5432/brewform_test"
          npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Seed database
        run: node packages/db/prisma/seed.cjs
        env:
          DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test

      - name: Run tests with coverage
        run: |
          deno test --unstable-sloppy-imports --no-check \
            --allow-env --allow-read --allow-write --allow-net --allow-sys \
            --coverage=coverage/ \
            apps/api/src/ packages/shared/src/

      - name: Generate coverage report
        run: deno coverage coverage/

      - name: Generate lcov report
        run: deno coverage coverage/ --lcov > coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  deploy-backend:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          cd packages/db && npx prisma generate --schema=prisma/schema.prisma

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: brewform-api
          entrypoint: apps/api/src/main.ts
          root: .

  deploy-frontend:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npx turbo run build --filter=@brewform/web
        env:
          VITE_API_URL: https://brewform-api.deno.dev/api/v1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
