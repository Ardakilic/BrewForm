name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Generate Drizzle migration
        run: deno task db:generate

      - name: Format check
        run: deno fmt --check apps/ packages/

      - name: Lint
        run: deno lint apps/ packages/

      - name: Type check
        run: deno check --unstable-sloppy-imports apps/api/src/main.ts

  test-unit:
    runs-on: ubuntu-latest
    needs: check
    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Run shared package tests
        run: |
          deno test --unstable-sloppy-imports --no-check \
            --allow-env --allow-read --allow-write --allow-net --allow-sys \
            packages/shared/src/
