name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: pnpm run db:generate

      - name: Build email templates
        run: pnpm run email-build

      - name: Format check
        run: pnpm run fmt-check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build web
        run: pnpm run build:web

  test-unit:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared package tests
        run: pnpm --filter @brewform/shared run test

  test-api:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brewform
          POSTGRES_PASSWORD: brewform
          POSTGRES_DB: brewform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewform:brewform@localhost:5432/brewform_test
      DATABASE_PROVIDER: postgresql
      JWT_SECRET: test-secret-for-ci-only-minimum-16-chars
      CACHE_DRIVER: memory
      APP_ENV: test
      APP_PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      STORAGE_DRIVER: local
      ENABLE_REGISTRATION: true

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert no uncommitted migrations
        run: |
          pnpm run db:generate
          git diff --exit-code

      - name: Build email templates
        run: pnpm run email-build

      - name: Run database migrations
        run: pnpm run db:migrate

      - name: Seed test database
        run: pnpm --filter @brewform/db run seed

      - name: Run API tests
        run: pnpm --filter @brewform/api run test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api-pr
          path: apps/api/coverage/
          retention-days: 7

  test-web:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @brewform/web run test
