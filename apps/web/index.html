<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrewForm -- Coffee Brewing Recipes</title>
    <meta
      name="description"
      content="Digitalize, share, and discover coffee brewing recipes and tasting notes."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph defaults -->
    <meta property="og:title" content="BrewForm" />
    <meta
      property="og:description"
      content="Digitalize, share, and discover coffee brewing recipes and tasting notes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_PUBLIC_APP_URL%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="BrewForm" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrewForm" />
    <meta
      name="twitter:description"
      content="Digitalize, share, and discover coffee brewing recipes and tasting notes."
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_APP_URL%/og-default.png" />

    <!-- Resource hints: preconnect to API origin (adjust domain for production) -->
    <!--
      If the API is on the same origin (e.g., Deno Deploy serving both SPA and API),
      these hints are unnecessary and can be removed. Add them when the API is on a
      separate domain (e.g., api.brewform.com).
    -->
    <!-- <link rel="preconnect" href="https://api.brewform.com" crossorigin /> -->
    <!-- <link rel="dns-prefetch" href="https://api.brewform.com" /> -->

    <!-- If using Google Fonts or an external font CDN, uncomment: -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <!-- <link rel="dns-prefetch" href="https://fonts.googleapis.com" /> -->
  </head>
  <body>
    <script>
      if (sessionStorage.redirect) {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (
          typeof redirect === 'string' &&
          redirect.charAt(0) === '/' &&
          redirect.charAt(1) !== '/' &&
          redirect.indexOf(':') === -1
        ) {
          history.replaceState(null, '', redirect);
        }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
